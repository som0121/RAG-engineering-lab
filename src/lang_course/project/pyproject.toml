[project]
name = "lang-course"
version = "0.1.0"
description = "LangChain and LangGraph application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.15",
    "langsmith>=0.14.11",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "typing-extensions>=4.12",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
