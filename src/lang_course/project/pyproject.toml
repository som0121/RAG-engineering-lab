[project]
name = "lang-course"
version = "0.1.0"
description = "LangChain and LangGraph application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.2",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langsmith>=0.14.11",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false